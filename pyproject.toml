[project]
name = "online-ocr"
version = "0.1.0"
description = "線上文字辨識 OCR：上傳圖片或 PDF，辨識中英文文字"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "python-multipart>=0.0.33",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
# 只用 uv 自己下載的 Python（避免在 Apple Silicon 上用到 Intel 版 Python，onnxruntime 沒有對應套件）
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
